name: Web Chinese font build
on:
  push:
    branches: [fix/web-chinese-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-chinese-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/../gridcraft-craft-fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Pinned external Chinese font
        run: python3 packaging/web/fetch-chinese-font.py "$CRAFT_FONTS_DIR"
      - name: Repository quality gate
        run: cargo xtask ci
      - name: Chinese glyph regression in every font role
        run: cargo test -p gridcraft-ui-egui --features web-fonts web_fonts::tests
      - name: Pinned Trunk
        run: |
          curl --fail --location --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz -o /tmp/trunk.tar.gz
          echo 'f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2  /tmp/trunk.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trunk"
          tar -xzf /tmp/trunk.tar.gz -C "$RUNNER_TEMP/trunk"
          echo "$RUNNER_TEMP/trunk" >> "$GITHUB_PATH"
      - name: Web build
        run: |
          cd apps/gridcraft-web
          trunk build --release --locked
      - name: Package with font provenance
        run: |
          cp "$CRAFT_FONTS_DIR/fonts/droid-sans-fallback/NOTICE" dist/web/NOTICE-DroidSansFallback.txt
          cp "$CRAFT_FONTS_DIR/fonts/droid-sans-fallback/font-source.json" dist/web/font-source.json
          bash packaging/web/package.sh --skip-build
          printf 'Repository: %s\nCommit: %s\nUpstream: a2cc4b42cac6e2c41bae71fba4607300755a0b47\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/release/SOURCE.txt
          cd dist/release
          sha256sum gridcraft-web-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-web-chinese
          path: |
            dist/release/gridcraft-web-*.zip
            dist/release/SHA256SUMS.txt
            dist/release/SOURCE.txt
          retention-days: 30
